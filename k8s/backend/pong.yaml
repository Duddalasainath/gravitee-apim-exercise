# Backend: nginx (unprivileged image) answering GET /ping with the exact body "pong".
# Chosen over a custom app so there is no image to build and nothing to maintain.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pong-nginx
  namespace: pong
  labels:
    app.kubernetes.io/name: pong
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /ping {
        if ($request_method !~ ^(GET|HEAD)$) {
          return 405;
        }
        default_type text/plain;
        return 200 'pong';
      }

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
      }

      location / {
        return 404;
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pong
  namespace: pong
  labels:
    app.kubernetes.io/name: pong
automountServiceAccountToken: false # the backend never talks to the Kubernetes API
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pong
  namespace: pong
  labels:
    app.kubernetes.io/name: pong
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pong
      annotations:
        # Roll the pods when the nginx config changes (bump when editing the ConfigMap).
        config-version: "1"
    spec:
      serviceAccountName: pong
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx user in nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pong
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.6-alpine # pinned; multi-arch
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # Writable paths nginx needs with a read-only root filesystem.
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: config
          configMap:
            name: pong-nginx
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: cache
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pong
  namespace: pong
  labels:
    app.kubernetes.io/name: pong
spec:
  type: ClusterIP # internal only: reachable solely through the gateway
  selector:
    app.kubernetes.io/name: pong
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pong
  namespace: pong
  labels:
    app.kubernetes.io/name: pong
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pong
