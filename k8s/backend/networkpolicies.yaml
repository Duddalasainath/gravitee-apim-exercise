# The backend accepts traffic only from the Gravitee gateway, and makes none.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: pong
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pong-from-gateway
  namespace: pong
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pong
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gravitee
          podSelector:
            matchLabels:
              app.kubernetes.io/name: apim
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 8080
