# Gravitee Kubernetes Operator (GKO), chart graviteeio/gko 4.12.20.
# Turns ApiV4Definition custom resources into API definitions the gateway
# loads. With no ManagementContext (DB-less mode) it writes them to ConfigMaps
# next to the resource, and the gateway watches those ConfigMaps.
manager:
  image:
    tag: "4.12.20" # pinned, same as the chart appVersion
    pullPolicy: IfNotPresent
  scope:
    # Only reconcile resources in the gateway namespace. The operator still
    # needs ClusterRoles for its CRDs and admission webhooks.
    cluster: true
    namespaces:
      - gravitee
  # The manager installs/updates its CRDs on start (Helm never upgrades CRDs).
  applyCRDs: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  logs:
    json: true
    level: info
  metrics:
    enabled: true
  webhook:
    # Validates ApiV4Definitions on admission, e.g. rejects duplicate context paths
    # within the watched namespace.
    enabled: true
    admission:
      # true needs cluster-wide list on apidefinitions, which a namespace-scoped
      # operator does not have: the webhook then rejects every API.
      checkApiContextPathConflictInCluster: false
  templating:
    # Disabled: we don't use [[ ]] placeholders, and in 4.12.20 the template engine
    # crashes the operator ("fatal error: concurrent map writes") when the mutating
    # and validating webhooks run concurrently.
    enabled: false

# Not used: we route through APIs, not Ingress or Gateway API resources.
ingress:
  controller:
    enabled: false
gatewayAPI:
  applyCRDs: false
  controller:
    enabled: false
