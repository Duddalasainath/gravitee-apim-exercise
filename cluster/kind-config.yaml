# Local Kubernetes cluster for the exercise (kind = Kubernetes IN Docker).
# Single node keeps the footprint inside the 4 CPU / 6 GB budget; the
# workload manifests are still written for multiple nodes (anti-affinity, PDBs).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gravitee
nodes:
  - role: control-plane
    # Pinned by digest so every machine runs the exact same Kubernetes build.
    # Taken from the kind v0.33.0 release notes.
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    extraPortMappings:
      # Host 127.0.0.1:8082 -> node port 30082 -> Gravitee gateway Service.
      # Bound to loopback only so the gateway is not exposed on the LAN.
      - containerPort: 30082
        hostPort: 8082
        listenAddress: "127.0.0.1"
        protocol: TCP
